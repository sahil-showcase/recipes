<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · Sahil’s Kitchen</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/recipe-videos.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Sahil’s Kitchen<span class="brand-dot">.</span></a>
    <a class="header-link" href="{{ '/' | relative_url }}#recipes">The recipe collection <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main" class="wrap">{{ content }}</main>
  <footer class="site-footer wrap"><span>From Sahil’s kitchen.</span><a href="mailto:spatel16300@gmail.com">Say hello <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
